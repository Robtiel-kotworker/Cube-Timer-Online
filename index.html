<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0c10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cube Timer" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
<script>
window.addEventListener('error', (e) => {
  document.body.innerHTML =
    '<pre style="color:#ff5d5d;white-space:pre-wrap;padding:20px;font-size:14px">' +
    (e.message || 'Unbekannter Fehler') + '\n\nDatei: ' + (e.filename || '?') +
    '\nZeile ' + e.lineno + ', Spalte ' + e.colno +
    '</pre>';
});
</script>

  <!-- Tailwind läuft direkt im Browser (Play CDN) – kein Build-Schritt nötig -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: '#0a0c10',
            panel: '#12151c',
            panelBorder: '#20242e',
            muted: '#7a8194',
            accent: '#4fd1c5',
            hold: '#ffcc33',
            good: '#3ddc84',
            bad: '#ff5d5d'
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', '"Space Mono"', 'ui-monospace', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- EmailJS läuft direkt im Browser per CDN – kein Backend nötig -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <title>Cube Timer</title>
</head>
<body class="font-mono bg-base text-white">
  <div id="root"></div>

  <!-- config.js VOR app.js laden, damit die Supabase- und EmailJS-Zugangsdaten beim Start bereits verfügbar sind -->
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
